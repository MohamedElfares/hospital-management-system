version: 2

# Weekly update pull requests, grouped so one review covers a whole
# ecosystem instead of arriving one pull request per package.
updates:
  # Backend dependencies, from backend/pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # The actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  # Base images in docker-compose.yml. Dockerfiles are a separate ecosystem
  # ("docker"), added in Milestone 1.2 when the production image exists.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # A PostgreSQL major upgrade is a decision, not a routine update: it must
      # match production (Neon) and change the CI service image in ci.yml in
      # the same pull request, which Dependabot can't do. Decided in IAM-6 (#19).
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # The hygiene hooks pinned in .pre-commit-config.yaml. Ruff isn't one of
  # them: its hooks run the version in backend/uv.lock, which the uv entry
  # above updates, so the hook and CI always use the same Ruff.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
