# Git hooks that run before every commit. Install once with:
#   cd backend && uv run pre-commit install --config ../.pre-commit-config.yaml
# The hooks match what CI checks, so problems are caught before pushing.

repos:
  # General hygiene for every file in the repository.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      # Blocks accidental commits of private keys.
      - id: detect-private-key

  # Ruff lint (with fixes) and format, limited to the backend. Both hooks run
  # the Ruff locked in backend/uv.lock, the one CI runs, so the hook and CI
  # can never disagree, and Dependabot updates Ruff in a single place.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
        require_serial: true
